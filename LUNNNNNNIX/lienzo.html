<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lienzo libre · Arte · Literary Universe</title>
<link rel="stylesheet" href="ASSETS/CSS/fuente.css">
<link rel="stylesheet" href="ASSETS/CSS/lienzo.css">
<link rel="icon" type="image/png" href="ASSETS/Imagenes/xandro.png">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><span class="brand-mark">LU</span><span>Literary Universe<small>MUNDO 02 · ARTE</small></span></a>
  <h1 class="titulo">🎨 Lienzo libre</h1>
  <a class="volver" href="juegos.html">← Volver a juegos</a>
</header>

<main class="estudio">
  <!-- Herramientas -->
  <nav class="herramientas" aria-label="Herramientas" id="herramientas">
    <button class="herr activa" data-herr="pincel" title="Pincel (B)"><span>🖌️</span><b>Pincel</b></button>
    <button class="herr" data-herr="acuarela" title="Acuarela"><span>💧</span><b>Acuarela</b></button>
    <button class="herr" data-herr="marcador" title="Marcador"><span>🖍️</span><b>Marcador</b></button>
    <button class="herr" data-herr="crayon" title="Crayón"><span>✏️</span><b>Crayón</b></button>
    <button class="herr" data-herr="spray" title="Spray"><span>💨</span><b>Spray</b></button>
    <button class="herr" data-herr="borrador" title="Borrador (E)"><span>🧽</span><b>Borrador</b></button>
    <button class="herr" data-herr="cubeta" title="Rellenar"><span>🌈</span><b>Rellenar</b></button>
    <button class="herr" data-herr="gotero" title="Gotero: copia un color"><span>🎯</span><b>Gotero</b></button>
  </nav>

  <!-- Caballete con el lienzo -->
  <section class="escenario">
    <div class="caballete">
      <div class="marco">
        <div class="lienzo" id="lienzo">
          <canvas id="fondo"></canvas>
          <canvas id="pintura"></canvas>
          <canvas id="trazo"></canvas>
        </div>
      </div>
      <div class="placa">LIENZO LIBRE · LUNIX</div>
    </div>
    <div class="anillo" id="anillo" hidden></div>
  </section>

  <!-- Panel de color y opciones -->
  <aside class="panel">
    <div class="caja">
      <h2>Colores</h2>
      <div class="paleta" id="paleta"></div>
      <div class="fila">
        <label class="mi-color" title="Elige cualquier color"><input type="color" id="colorLibre" value="#1f5bff"><span>🎨 Mezclar mi color</span></label>
      </div>
      <div class="recientes" id="recientes" aria-label="Colores recientes"></div>
    </div>

    <div class="caja">
      <h2>Pincel</h2>
      <label class="ctl">Tamaño <b id="vTam">18</b><input type="range" id="tam" min="2" max="90" value="18"></label>
      <label class="ctl">Intensidad <b id="vOpa">100%</b><input type="range" id="opa" min="5" max="100" value="100"></label>
      <div class="vista-pincel"><i id="vistaPincel"></i></div>
    </div>

    <div class="caja">
      <h2>Simetría <small>(¡mandalas!)</small></h2>
      <div class="chips" id="simetria">
        <button class="chip activa" data-sim="off">Libre</button>
        <button class="chip" data-sim="espejo">Espejo</button>
        <button class="chip" data-sim="x4">4 lados</button>
        <button class="chip" data-sim="rad6">Estrella</button>
        <button class="chip" data-sim="mandala">Mandala</button>
      </div>
    </div>

    <div class="caja">
      <h2>Papel</h2>
      <div class="papeles" id="papeles"></div>
    </div>

    <div class="acciones">
      <button class="btn" id="deshacer" title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
      <button class="btn" id="rehacer" title="Rehacer (Ctrl+Y)">↷ Rehacer</button>
      <button class="btn peligro" id="limpiar">🗑 Limpiar</button>
      <button class="btn grande" id="guardar">⬇ Guardar mi obra</button>
    </div>
  </aside>
</main>

<script src="ASSETS/JS/lienzo.js"></script>
</body>
</html>
